<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - College Resource Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-background">
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
            </div>
        </div>
        
        <div class="container-fluid h-100">
            <div class="row h-100">
                <!-- Left Side - Branding -->
                <div class="col-lg-6 d-none d-lg-flex auth-branding">
                    <div class="branding-content">
                        <div class="brand-logo">
                            <i class="fas fa-graduation-cap"></i>
                        </div>
                        <h1 class="brand-title">Join Our Community</h1>
                        <p class="brand-subtitle">Start your academic journey with us</p>
                        <div class="features-list">
                            <div class="feature-item">
                                <i class="fas fa-rocket"></i>
                                <span>Get started in minutes</span>
                            </div>
                            <div class="feature-item">
                                <i class="fas fa-shield-alt"></i>
                                <span>Secure and private</span>
                            </div>
                            <div class="feature-item">
                                <i class="fas fa-star"></i>
                                <span>Join thousands of students</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Right Side - Signup Form -->
                <div class="col-lg-6 auth-form-section">
                    <div class="auth-form-container">
                        <div class="auth-header">
                            <h2 class="auth-title">Create Account</h2>
                            <p class="auth-description">Join our academic community today</p>
                        </div>
                        
                        <form id="signupForm" class="auth-form">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="fullName" class="form-label">
                                            <i class="fas fa-user me-2"></i>Full Name
                                        </label>
                                        <input type="text" class="form-control" id="fullName" required>
                                        <div class="form-feedback"></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="email" class="form-label">
                                            <i class="fas fa-envelope me-2"></i>Email Address
                                        </label>
                                        <input type="email" class="form-control" id="email" required>
                                        <div class="form-feedback"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="role" class="form-label">
                                            <i class="fas fa-user-tag me-2"></i>Role
                                        </label>
                                        <select class="form-select" id="role" required onchange="toggleStudentFields()">
                                            <option value="">Select Role</option>
                                            <option value="student">Student</option>
                                            <option value="faculty">Faculty</option>
                                        </select>
                                        <div class="form-feedback"></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="department" class="form-label">
                                            <i class="fas fa-building me-2"></i>Department
                                        </label>
                                        <select class="form-select" id="department" required>
                                            <option value="">Select Department</option>
                                            <option value="Civil Engineering">Civil Engineering</option>
                                            <option value="Electrical Engineering">Electrical Engineering</option>
                                            <option value="Electronics and Telecommunications Engineering">Electronics and Telecommunications Engineering</option>
                                            <option value="Computer Engineering">Computer Engineering</option>
                                            <option value="Chemical Engineering">Chemical Engineering</option>
                                        </select>
                                        <div class="form-feedback"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row" id="studentFields" style="display: none;">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="studentId" class="form-label">
                                            <i class="fas fa-id-card me-2"></i>Student ID
                                        </label>
                                        <input type="text" class="form-control" id="studentId">
                                        <div class="form-feedback"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="password" class="form-label">
                                            <i class="fas fa-lock me-2"></i>Password
                                        </label>
                                        <div class="password-input">
                                            <input type="password" class="form-control" id="password" required>
                                            <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                                <i class="fas fa-eye" id="passwordIcon"></i>
                                            </button>
                                        </div>
                                        <div class="form-feedback"></div>
                                        <div class="password-strength">
                                            <div class="strength-bar">
                                                <div class="strength-fill" id="strengthFill"></div>
                                            </div>
                                            <span class="strength-text" id="strengthText">Password strength</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="confirmPassword" class="form-label">
                                            <i class="fas fa-lock me-2"></i>Confirm Password
                                        </label>
                                        <div class="password-input">
                                            <input type="password" class="form-control" id="confirmPassword" required>
                                            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                                                <i class="fas fa-eye" id="confirmPasswordIcon"></i>
                                            </button>
                                        </div>
                                        <div class="form-feedback"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                                    <label class="form-check-label" for="agreeTerms">
                                        I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#" class="auth-link">Privacy Policy</a>
                                    </label>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary auth-btn" id="signupBtn">
                                <span class="btn-text">Create Account</span>
                                <span class="btn-spinner d-none">
                                    <i class="fas fa-spinner fa-spin me-2"></i>Creating Account...
                                </span>
                            </button>
                        </form>
                        
                        <div class="auth-divider">
                            <span>or</span>
                        </div>
                        
                        <div class="social-login">
                            <button class="btn btn-outline-secondary social-btn">
                                <i class="fab fa-google me-2"></i>Continue with Google
                            </button>
                        </div>
                        
                        <div class="auth-footer">
                            <p>Already have an account? <a href="login.html" class="auth-link">Sign in here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Alert Container -->
    <div id="alertContainer"></div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth-utils.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
