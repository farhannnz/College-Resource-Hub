<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - College Resource Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
    <style>
        .admin-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
        .auth-branding {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn-primary.auth-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary.auth-btn:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-background">
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
            </div>
        </div>
        
        <div class="container-fluid h-100">
            <div class="row h-100">
                <!-- Left Side - Branding -->
                <div class="col-lg-6 d-none d-lg-flex auth-branding">
                    <div class="branding-content">
                        <div class="brand-logo">
                            <i class="fas fa-shield-alt"></i>
                        </div>
                        <h1 class="brand-title">Admin Portal</h1>
                        <p class="brand-subtitle">Secure administrative access</p>
                        <div class="features-list">
                            <div class="feature-item">
                                <i class="fas fa-upload"></i>
                                <span>Upload and manage study resources</span>
                            </div>
                            <div class="feature-item">
                                <i class="fas fa-trash-alt"></i>
                                <span>Delete inappropriate content</span>
                            </div>
                            <div class="feature-item">
                                <i class="fas fa-users-cog"></i>
                                <span>Manage users and permissions</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Right Side - Login Form -->
                <div class="col-lg-6 auth-form-section">
                    <div class="auth-form-container">
                        <div class="auth-header">
                            <span class="admin-badge">
                                <i class="fas fa-shield-alt me-2"></i>ADMIN ACCESS
                            </span>
                            <h2 class="auth-title">Administrator Login</h2>
                            <p class="auth-description">Enter your admin credentials to continue</p>
                        </div>
                        
                        <form id="adminLoginForm" class="auth-form">
                            <div class="form-group">
                                <label for="email" class="form-label">
                                    <i class="fas fa-envelope me-2"></i>Admin Email
                                </label>
                                <input type="email" class="form-control" id="email" required>
                                <div class="form-feedback"></div>
                            </div>
                            
                            <div class="form-group">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-2"></i>Admin Password
                                </label>
                                <div class="password-input">
                                    <input type="password" class="form-control" id="password" required>
                                    <button type="button" class="password-toggle" onclick="togglePassword()">
                                        <i class="fas fa-eye" id="passwordIcon"></i>
                                    </button>
                                </div>
                                <div class="form-feedback"></div>
                            </div>
                            
                            <div class="alert alert-warning" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                This portal is restricted to authorized administrators only.
                            </div>
                            
                            <button type="submit" class="btn btn-primary auth-btn" id="loginBtn">
                                <span class="btn-text">
                                    <i class="fas fa-sign-in-alt me-2"></i>Admin Sign In
                                </span>
                                <span class="btn-spinner d-none">
                                    <i class="fas fa-spinner fa-spin me-2"></i>Verifying...
                                </span>
                            </button>
                        </form>
                        
                        <div class="auth-footer mt-4">
                            <p>
                                <a href="login.html" class="auth-link">
                                    <i class="fas fa-arrow-left me-2"></i>Back to Student Login
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Alert Container -->
    <div id="alertContainer"></div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth-utils.js"></script>
    <script src="js/admin-login.js"></script>
</body>
</html>
