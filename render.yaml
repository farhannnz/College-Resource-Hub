services:
  - type: web
    name: college-resource-hub
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromDatabase:
          name: college-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: HUGGINGFACE_API_KEY
        value: hf_free_no_key_needed

databases:
  - name: college-hub-db
    databaseName: college_resource_hub
    user: college_user